<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <title>Definitions Explorer · Tab 1 | Monaco V1</title>
  <link rel="stylesheet" href="./workspace/css/workspace.css">
  <link rel="stylesheet" href="./components/left/css/left.css">
  <link rel="stylesheet" href="./components/right/css/right.css">
</head>

<body>
  <main class="workspace" id="leftWorkspace">
    <aside class="left-workspace" aria-label="Definitions Selectors">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
        <span style="font-size: 11px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px;">DEFINITIONS STUDIO</span>
        <a href="../../index.html" style="font-size: 11px; color: #8fa5c4; text-decoration: none;"
          title="Back to Monaco V1 Hub">← Hub</a>
      </div>

      <div class="control-group">
        <label for="rootSelect">Control Type</label>
        <select id="rootSelect">
          <option value="">Select Control</option>
        </select>
      </div>

      <div class="control-group" id="variantStep">
        <label for="variantSelect">Variation</label>
        <select id="variantSelect" disabled>
          <option value="">Select Variation</option>
        </select>
      </div>

      <button id="showAll" class="show-all-btn" type="button">Show all</button>
    </aside>

    <section class="right-workspace" id="rightWorkspace" aria-label="Monaco Editor">
      <div class="editor-header">
        <div class="editor-header-left">
          <span id="editorTitle">definitions.json</span>
          <span id="editorPath">Complete library</span>
        </div>
        <div class="editor-header-right">
          <span id="editorUrl" class="editor-url-pill" title=""></span>
          <button id="renderBtn" class="render-btn" type="button">Render</button>
        </div>
      </div>
      <div id="monacoEditor" class="monaco-editor"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="./index.js"></script>
</body>

</html>
